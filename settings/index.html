<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body { font-family: -apple-system, system-ui, sans-serif; padding: 16px; }
      h2 { font-size: 17px; margin: 0 0 4px; }
      p { color: #666; font-size: 14px; margin: 0 0 16px; }
      button {
        width: 100%; padding: 14px; font-size: 16px; font-weight: 600;
        border: none; border-radius: 12px; background: #ec1c24; color: #fff; cursor: pointer;
      }
      button:disabled { opacity: 0.6; cursor: default; }
      #status { margin-top: 14px; font-size: 14px; text-align: center; min-height: 20px; }
      .ok { color: #1a8f3c; }
      .err { color: #ec1c24; }
    </style>
  </head>
  <body>
    <script type="text/javascript" src="/homey.js" data-origin="settings"></script>
    <h2 data-i18n="settings.title">Herverbinden</h2>
    <p data-i18n="settings.desc">
      Verbreekt en herstelt de verbinding met de Ziggo-cloud en haalt je boxen opnieuw op.
      Handig als de app je boxen niet meer ziet (bijvoorbeeld na een netwerkwijziging).
    </p>
    <button id="btn" data-i18n="settings.button">Herverbinden</button>
    <div id="status"></div>

    <script type="text/javascript">
      function onHomeyReady(Homey) {
        Homey.ready();
        var btn = document.getElementById('btn');
        var status = document.getElementById('status');

        btn.addEventListener('click', function () {
          btn.disabled = true;
          status.className = '';
          status.textContent = 'Bezig met herverbinden…';
          Homey.api('GET', '/reconnect', null, function (err, result) {
            btn.disabled = false;
            if (err) {
              status.className = 'err';
              status.textContent = 'Mislukt: ' + (err.message || err);
              return;
            }
            var n = result && result.accounts ? result.accounts : 0;
            status.className = 'ok';
            status.textContent = n > 0
              ? ('Klaar — ' + n + ' account(s) opnieuw verbonden.')
              : 'Klaar — geen gekoppelde boxen gevonden.';
          });
        });
      }
    </script>
  </body>
</html>
